
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JTK E-SPORTS MATCH MANAGER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#f4f7ff;font-family:Arial,sans-serif;padding:15px}
header{text-align:center;padding:20px 5px}
h1{color:#40e0d0;font-size:25px;margin:0 0 8px}
.panel{background:#151d32;border:1px solid #34415d;border-radius:12px;padding:14px;margin:14px 0}
.tabs{display:flex;gap:8px}
button{background:#263653;color:white;border:0;border-radius:7px;padding:11px;cursor:pointer}
button.active,.primary{background:#00a99d;color:#061b20;font-weight:bold}
input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #465674;border-radius:7px;background:#0c1426;color:white}
label{display:block;color:#bdc8dd;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team,.entry{background:#202b43;padding:10px;border-radius:8px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #34415d;text-align:left}
.scroll{overflow-x:auto}
.small{color:#9eacc5;font-size:12px}
</style>
</head>
<body>
<header>
<h1>JTK E-SPORTS</h1>
<div>E-SPORTS MATCH MANAGER</div>
</header>

<div class="panel">
<h3>Match Selection</h3>
<div class="tabs">
<button class="active" onclick="changeMatch(1)">Match 1</button>
<button onclick="changeMatch(2)">Match 2</button>
<button onclick="changeMatch(3)">Match 3</button>
</div>
<p id="matchLabel">Current Match: 1</p>
</div>

<div class="panel">
<h3>Team Details</h3>
<label>Team Name</label><input id="teamName" placeholder="Enter team name">
<label>Team TAG</label><input id="teamTag" placeholder="Enter team tag">
<label>Team Logo</label><input id="teamLogo" type="file" accept="image/*">
<button class="primary" onclick="addTeam()">Add Team</button>
<div id="teamSlots"></div>
</div>

<div class="panel">
<h3>Submission Panel</h3>
<label>Screenshot Upload</label>
<input type="file" id="screenshotUpload" accept="image/*">
<button onclick="scanScreenshot()">Scan Screenshot</button>
<div id="shotPreview"></div>
</div>Scorecard Entries</div>
